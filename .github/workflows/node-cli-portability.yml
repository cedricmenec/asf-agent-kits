name: Portable Node CLI qualification (non-paying)

on:
  pull_request:
    paths:
      - tools/node/secure-fs.mjs
      - tests/portable-cli-qualification.test.mjs
      - tests/node-migration-files.test.mjs
      - tests/opencode-direct.test.mjs
      - tests/multi-profile.test.mjs
      - .github/workflows/node-cli-portability.yml

permissions:
  contents: read

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.13.0'
          cache: npm
      - name: Install CLI dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Run portable CLI install, status, doctor, upgrade and safety checks
        run: node --test tests/portable-cli-qualification.test.mjs
