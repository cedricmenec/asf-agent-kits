name: R1 Contract & Workflow Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.13.0'
          cache: npm
      - name: Run non-paying contract and fixture tests
        run: |
          npm ci --ignore-scripts
          npm run check
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.2'
      - name: actionlint (v1.7.7, pinned upstream commit)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106
          "$(go env GOPATH)/bin/actionlint" -version
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Qualify rendered OpenCode/OpenSpec kit, no LLM or installation
        run: |
          node tools/qualify_mvp_render.mjs \
            --config kits/opencode-openspec/mvp-config.example.json \
            --actionlint "$(go env GOPATH)/bin/actionlint"
